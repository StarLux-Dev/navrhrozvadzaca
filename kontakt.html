<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kontakt – Návrh elektrického rozvádzača</title>
<meta name="description" content="Napíšte nám otázku alebo pripomienku ku kalkulačke Návrh elektrického rozvádzača.">
<link rel="canonical" href="https://navrhrozvadzaca.sk/kontakt.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23141A23'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23F5A623'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --navy:#141A23; --amber:#F5A623; --amber-dark:#C97F0E;
    --bg:#F1F3F6; --panel:#FFFFFF; --border:#DCE1E7; --text:#1B2430; --text-muted:#6B7280;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  a { color:inherit; }
  .topbar { background:var(--navy); border-bottom:4px solid var(--amber); }
  .topbar-inner { max-width:760px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; }
  .brand { color:#fff; font-size:19px; font-weight:700; display:flex; align-items:center; gap:8px; text-decoration:none; }
  .brand-mark { color:var(--amber); }
  .topnav { display:flex; gap:2px; flex-wrap:wrap; }
  .topnav-link { color:#C9D0D8; font-size:13px; font-weight:600; padding:7px 11px; border-radius:6px; text-decoration:none; }
  .topnav-link:hover { background:rgba(255,255,255,.08); color:#fff; }
  .topnav-link.active { color:var(--amber); background:rgba(245,166,35,.13); }
  .wrap { max-width:620px; margin:0 auto; padding:28px 18px 60px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px 26px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { font-size:13.5px; color:var(--text-muted); line-height:1.6; margin:0 0 22px; }
  label { display:block; font-size:13px; font-weight:600; color:#3A4350; margin-bottom:5px; }
  input[type=text], input[type=email], textarea {
    width:100%; padding:11px 12px; border:1px solid #C9D0D8; border-radius:6px; font-size:15px;
    font-family:inherit; background:#fff; margin-bottom:16px;
  }
  textarea { min-height:130px; resize:vertical; }
  .consent-row { display:flex; align-items:flex-start; gap:9px; margin-bottom:18px; }
  .consent-row input { margin-top:3px; width:17px; height:17px; flex-shrink:0; accent-color:var(--amber); }
  .consent-row label { font-size:12.5px; font-weight:400; color:#6B7280; margin:0; line-height:1.5; }
  .consent-row a { color:var(--amber-dark); }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; background:var(--amber); color:var(--navy);
    border:none; padding:13px 20px; border-radius:7px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit; width:100%;
  }
  .btn:hover { background:var(--amber-dark); color:#fff; }
  .alt-contact { font-size:12.5px; color:var(--text-muted); margin-top:20px; line-height:1.6; }
  .alt-contact a { color:var(--amber-dark); }
  .back { display:inline-block; margin-top:24px; font-size:13.5px; color:var(--text-muted); text-decoration:none; }
  .back:hover { color:var(--text); }
  /* honeypot pole – skryté pred ľuďmi, viditeľné pre boty */
  .hp { position:absolute; left:-9999px; top:-9999px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark">⚡</span>Návrh elektrického rozvádzača</a>
    <nav class="topnav" aria-label="Hlavná navigácia">
      <a href="index.html" class="topnav-link">Kalkulačka</a>
      <a href="index.html#faq" class="topnav-link">FAQ</a>
      <a href="kontakt.html" class="topnav-link active">Kontakt</a>
    </nav>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <h1>Kontakt</h1>
    <p class="sub">Máš otázku, pripomienku alebo si našiel chybu v kalkulačke? Napíš mi — odpoviem čo najskôr.</p>

    <form action="https://formsubmit.co/chobot.lukas913@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Nová správa z navrhrozvadzaca.sk">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="https://navrhrozvadzaca.sk/dakujeme.html">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

      <label for="name">Meno</label>
      <input type="text" id="name" name="Meno" required maxlength="100">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="Email" required maxlength="150">

      <label for="message">Správa / otázka</label>
      <textarea id="message" name="Správa" required maxlength="3000"></textarea>

      <div class="consent-row">
        <input type="checkbox" id="consent" required>
        <label for="consent">Súhlasím so spracovaním zadaných osobných údajov za účelom vybavenia mojej správy, v súlade so <a href="privacy.html">zásadami ochrany osobných údajov</a>.</label>
      </div>

      <button type="submit" class="btn">Odoslať správu</button>
    </form>

    <p class="alt-contact">Prípadne môžeš napísať priamo na <a href="mailto:chobot.lukas913@gmail.com">chobot.lukas913@gmail.com</a>.</p>

    <a class="back" href="index.html">← Späť na kalkulačku</a>
  </div>
</div>

</body>
</html>
